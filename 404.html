<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — Romain Lance</title>
  <meta name="robots" content="noindex">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%231d6382'/><text x='50' y='69' font-family='ui-monospace,monospace' font-size='46' font-weight='700' fill='%23ffffff' text-anchor='middle'>RL</text></svg>">

  <!--
    Page servie par l'hébergeur pour n'importe quelle adresse inconnue, donc
    à n'importe quelle profondeur : `/truc`, `/projets/truc`, `/a/b/c`. Une
    feuille de styles liée en relatif s'y casserait, et un lien relatif vers
    l'accueil aussi. D'où ce fichier entièrement autonome — styles inclus,
    aucune image, aucun script — et un lien de retour reconstruit en JS
    depuis l'adresse courante.
  -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f2ed; --ink: #14161a; --muted: #59616d;
      --line: rgba(20, 22, 26, .13); --accent: #1d6382;
      --grid: rgba(20, 22, 26, .055);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1014; --ink: #e7eaee; --muted: #98a1ad;
        --line: rgba(231, 234, 238, .13); --accent: #63b3d4;
        --grid: rgba(231, 234, 238, .05);
      }
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    /* Même grille technique que le reste du site */
    body::before {
      content: '';
      position: fixed;
      inset: -10%;
      z-index: -1;
      background-image:
        linear-gradient(to right, var(--grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
      background-size: 76px 76px;
      -webkit-mask-image: radial-gradient(ellipse 85% 55% at 50% 0%, #000 5%, transparent 78%);
              mask-image: radial-gradient(ellipse 85% 55% at 50% 0%, #000 5%, transparent 78%);
      pointer-events: none;
    }

    main { max-width: 34rem; text-align: center; }

    .code {
      font-family: ui-monospace, 'SFMono-Regular', monospace;
      font-size: .74rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1 {
      margin-top: 1rem;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -.03em;
      line-height: 1.1;
    }

    p { margin-top: 1rem; color: var(--muted); }

    a {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      margin-top: 2rem;
      padding: .8rem 1.4rem;
      border-radius: 11px;
      background: var(--accent);
      color: var(--bg);
      font-size: .92rem;
      font-weight: 500;
      text-decoration: none;
      transition: opacity .2s ease;
    }
    a:hover { opacity: .88; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>

<body>
  <main>
    <p class="code">Erreur 404</p>
    <h1>Cette page n'existe pas</h1>
    <p>
      L'adresse demandée ne correspond à aucune page du site. Elle a peut-être
      changé, ou comporte une faute de frappe.
    </p>
    <a id="home" href="/">Retour à l'accueil</a>
  </main>

  <script>
    /* Le site peut vivre à la racine d'un domaine ou dans un sous-dossier
       (« /portfolio/ » sur GitHub Pages). On reconstruit donc le lien de
       retour à partir du premier segment de l'adresse courante, plutôt que
       de coder « / » en dur. */
    (function () {
      var seg = window.location.pathname.split('/').filter(Boolean);
      var home = document.getElementById('home');
      if (seg.length && !/\./.test(seg[0])) { home.setAttribute('href', '/' + seg[0] + '/'); }
    })();
  </script>
</body>
</html>
